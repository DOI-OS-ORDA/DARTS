services:
  app:
    build: .
    volumes:
      - .:/app
    working_dir: /app/darts
    entrypoint: python /app/darts/docker_entrypoint.py
    depends_on:
      - db
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 5
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - DATABASE_URL=postgres://darts_user:darts_password@db/darts
      - RUNNING_IN_DOCKER=yup
      - DJANGO_SETTINGS_MODULE=darts.settings.dev
      - ALLOWED_HOSTS=localhost,app,0.0.0.0
    stdin_open: true
    tty: true
    ports:
      - "8000:8000"
    command: >
      bash -c "python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000"

  db:
    build:
      context: .
      dockerfile: ./.docker/Postgres.Dockerfile
    environment:
      - POSTGRES_DB=darts
      - POSTGRES_USER=darts_user
      - POSTGRES_PASSWORD=darts_password
    volumes:
      - dbdata:/var/lib/postgresql/data

  owasp:
    image: zaproxy/zap-weekly
    command: zap-baseline.py -t http://app:8000 -c zap.conf -I -r zap_report.html
    depends_on:
      - app
    volumes:
      - .:/zap/wrk/
    profiles: ["owasp-scan"]


  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=hello@gsa.gov
      - PGADMIN_DEFAULT_PASSWORD=password
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: always

volumes:
  dbdata:
